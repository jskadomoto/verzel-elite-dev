x-api-environment: &api-environment
  PORT: 8080
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tickets}
  SESSION_SECRET: ${SESSION_SECRET:-sessao-de-demonstracao-nao-use-em-producao}
  TICKET_SECRET: ${TICKET_SECRET:-ingresso-de-demonstracao-nao-use-em-producao}
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s

  api:
    build: ./api
    environment: *api-environment
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24

  seed:
    build: ./api
    command: ["node", "dist/db/seed.js"]
    environment: *api-environment
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web:
    build: ./web
    environment:
      API_URL: http://api:8080
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
